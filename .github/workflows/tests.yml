name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    name: Test puri e stile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_local.txt
      - run: ruff check .
      - run: pytest tests/unit

  ha:
    name: Test con Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest tests/ha
