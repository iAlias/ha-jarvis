[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# I test con HA importano l'integrazione come `custom_components.jarvis`.
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["homeassistant"]
known-local-folder = ["custom_components"]
